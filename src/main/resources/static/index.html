<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-circle bg1"></div>
<div class="bg-circle bg2"></div>
<div class="bg-circle bg3"></div>

<div class="auth-wrapper">
    <div class="auth-card" id="authCard">

        <!-- LOGIN PANEL -->
        <div class="form-panel login-panel">
            <div class="logo">🔐</div>
            <h1>Welcome</h1>
            <p class="subtitle">Login to continue your journey</p>

            <form id="loginForm">
                <!-- EMAIL -->
                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="email" id="loginEmail" placeholder=" " autocomplete="email" required>
                    <label for="loginEmail">Email Address</label>
                </div>

                <!-- PASSWORD -->
                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="password" id="loginPassword" placeholder=" " autocomplete="current-password" required>
                    <label for="loginPassword">Password</label>
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword',this)">👁</button>
                </div>

                <div class="options">
                    <label class="checkbox">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <div id="loginMessage" class="api-message"></div>

                <button type="submit" class="main-btn">LOGIN</button>
            </form>

            <div class="switch-area">
                <span>Don't have an account?</span>
                <button type="button" class="switch-circle" onclick="flipCard()">+</button>
            </div>

            <div class="social">
                <button type="button">G</button>
                <button type="button">f</button>
                <button type="button">in</button>
            </div>
        </div>

        <!-- SIGNUP PANEL -->
        <div class="form-panel signup-panel">
            <div class="logo">✨</div>
            <h1>Create Account</h1>
            <p class="subtitle">Start your journey with us</p>

            <form id="signupForm">
                <!-- NAME -->
                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="text" id="signupName" placeholder=" " autocomplete="name" required>
                    <label for="signupName">Full Name</label>
                </div>

                <!-- EMAIL -->
                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="email" id="signupEmail" placeholder=" " autocomplete="email" required>
                    <label for="signupEmail">Email Address</label>
                </div>

                <!-- PASSWORD -->
                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="password" id="signupPassword" placeholder=" " autocomplete="new-password" required>
                    <label for="signupPassword">Password</label>
                    <button type="button" class="password-toggle" onclick="togglePassword('signupPassword',this)">👁</button>
                </div>

                <!-- CONFIRM -->
                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password" required>
                    <label for="confirmPassword">Confirm Password</label>
                </div>

                <div id="signupMessage" class="api-message"></div>

                <button type="submit" class="main-btn">CREATE ACCOUNT</button>
            </form>

            <div class="switch-area">
                <span>Already have an account?</span>
                <button type="button" class="switch-circle" onclick="flipCard()">←</button>
            </div>

            <div class="social">
                <button type="button">G</button>
                <button type="button">f</button>
                <button type="button">in</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
